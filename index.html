:root{--bg:#06060A;--surf:#0C0C12;--card:#111118;--card2:#161620;--bord:#1E1E2E;--bord2:#252535;--gold:#C8A84B;--gold2:#E8C96A;--gold3:#7A6030;--gold4:#2A1E08;--green:#1DB954;--red:#E74C3C;--blue:#2E86C1;--purple:#8B5CF6;--text:#F0EDE8;--muted:#6B6880;--dim:#3A3850}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body,#root{height:100%;background:var(--bg);overflow:hidden}
body{color:var(--text);font-family:'Outfit',sans-serif;-webkit-text-size-adjust:100%}
input,select,textarea{background:var(--card2);border:1.5px solid var(--bord2);color:var(--text);padding:12px 14px;border-radius:10px;font-size:16px;width:100%;outline:none;-webkit-appearance:none;font-family:'Outfit',sans-serif;transition:all .15s}
input:focus,select:focus,textarea:focus{border-color:var(--gold);background:#1A1A28;box-shadow:0 0 0 3px rgba(200,168,75,.1)}
input[type=date]{min-height:47px}
select option{background:var(--card2)}
textarea{resize:none;min-height:80px}
button{cursor:pointer;font-family:'Outfit',sans-serif;border:none;-webkit-appearance:none;transition:all .15s}
button:active{transform:scale(.97);opacity:.85}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:var(--gold3);border-radius:3px}
@keyframes su{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fd{from{opacity:0}to{opacity:1}}
.su{animation:su .25s cubic-bezier(.22,1,.36,1)}
.fd{animation:fd .2s ease}
.cinzel{font-family:'Cinzel',serif !important}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.shake{animation:shake .4s}
#print-area{display:none}
@media print{@page{margin:10mm}html,body{height:auto!important;overflow:visible!important;background:#fff!important}#root{display:none!important}#print-area{display:block!important}#print-area>div{min-width:0!important;padding:0!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

</style>
